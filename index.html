<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalSync AR</title>


    <!-- Official MindAR-compatible A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR 1.2.5 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

        }


        /*
         * Do not position the MindAR camera video
         * manually.
         *
         * MindAR controls it.
         */

        a-scene {

            width: 100%;
            height: 100%;

        }


        /*
         * AR content appears only after
         * the card is detected.
         */

        #ui {

            position: fixed;

            left: 50%;

            bottom: 30px;

            transform: translateX(-50%);

            z-index: 10;

            display: none;

            flex-direction: column;

            gap: 10px;

            width: 210px;

        }


        .button {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 13px;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

        }


        #openApp {

            background: #176dcc;

        }


        #website {

            background: #152b45;

        }

    </style>

</head>


<body>


    <!-- =====================================
         MINDAR SCENE
    ====================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- CAMERA -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        ></a-camera>


        <!-- =================================
             LOCALSYNC TARGET
        ================================== -->

        <a-entity

            id="localSyncTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- LOCALSYNC -->

            <a-text

                value="LocalSync"

                position="0 0.20 0.10"

                align="center"

                width="0.95"

                color="#8fd3ff"

                side="double"

            ></a-text>


            <!-- TAGLINE -->

            <a-text

                value="LOCAL • CONNECTED • SMART"

                position="0 0.08 0.10"

                align="center"

                width="0.55"

                color="#c5d3e0"

                side="double"

            ></a-text>


            <!-- OPEN APP -->

            <a-plane

                position="0 -0.08 0.10"

                width="0.65"

                height="0.15"

                color="#176dcc"

            ></a-plane>


            <a-text

                value="OPEN APP"

                position="0 -0.08 0.12"

                align="center"

                width="0.52"

                color="#ffffff"

                side="double"

            ></a-text>


            <!-- VISIT WEBSITE -->

            <a-plane

                position="0 -0.27 0.10"

                width="0.65"

                height="0.15"

                color="#152b45"

            ></a-plane>


            <a-text

                value="VISIT WEBSITE"

                position="0 -0.27 0.12"

                align="center"

                width="0.48"

                color="#ffffff"

                side="double"

            ></a-text>


        </a-entity>


    </a-scene>


    <!-- =====================================
         HTML BUTTON FALLBACK UI
    ====================================== -->

    <div id="ui">

        <button
            id="openApp"
            class="button"
        >
            OPEN APP
        </button>


        <button
            id="website"
            class="button"
        >
            VISIT WEBSITE
        </button>

    </div>


    <script>

        /*
         * LocalSync website
         */

        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


        /*
         * Real app deep link will be added later.
         */

        const APP_URL = "";


        /*
         * Target
         */

        const target =
            document.querySelector(
                "#localSyncTarget"
            );


        /*
         * UI
         */

        const ui =
            document.querySelector(
                "#ui"
            );


        /*
         * CARD DETECTED
         */

        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "LocalSync card detected"
                );


                ui.style.display =
                    "flex";

            }
        );


        /*
         * CARD LOST
         */

        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "LocalSync card lost"
                );


                ui.style.display =
                    "none";

            }
        );


        /*
         * WEBSITE
         */

        document
            .querySelector("#website")
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        WEBSITE_URL;

                }
            );


        /*
         * APP
         */

        document
            .querySelector("#openApp")
            .addEventListener(
                "click",
                () => {

                    if (
                        APP_URL.trim() !== ""
                    ) {

                        window.location.href =
                            APP_URL;

                    }

                    else {

                        alert(
                            "The LocalSync app link will be connected here."
                        );

                    }

                }
            );


    </script>


</body>

</html>
