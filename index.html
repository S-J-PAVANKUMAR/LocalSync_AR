<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>LocalSync AR</title>


    <!-- A-FRAME -->

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>


    <!-- MINDAR -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

        }


        /* ======================================
           START SCREEN
        ====================================== */

        #startScreen {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #10283b 0%,
                    #050b12 60%,
                    #000000 100%
                );

            color: white;

            text-align: center;

            z-index: 9999;

        }


        #startScreen h1 {

            margin: 0 0 12px;

            font-size: 32px;

            letter-spacing: 1px;

        }


        #startScreen p {

            margin: 0 25px 28px;

            color: #b9c8d5;

            font-size: 15px;

            line-height: 1.5;

        }


        #startButton {

            border: none;

            border-radius: 14px;

            padding: 15px 34px;

            background: #176dcc;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

        }


        #startButton:active {

            transform: scale(0.96);

        }


        /* ======================================
           STATUS
        ====================================== */

        #status {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9000;

            display: none;

            padding: 10px 16px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            font-size: 13px;

            text-align: center;

            max-width: 85%;

        }


        /* ======================================
           ERROR
        ====================================== */

        #errorBox {

            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 82%;

            max-width: 360px;

            padding: 22px;

            border-radius: 18px;

            background: rgba(5, 10, 16, 0.96);

            color: white;

            text-align: center;

            z-index: 10000;

            display: none;

        }


        #errorBox h2 {

            margin-top: 0;

        }


        #errorText {

            color: #c5d3e0;

            font-size: 14px;

            line-height: 1.5;

            word-break: break-word;

        }


        #retryButton {

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            padding: 12px 24px;

            background: #176dcc;

            color: white;

            font-weight: bold;

        }


        /* ======================================
           A-FRAME
        ====================================== */

        a-scene {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


    <!-- ======================================
         START SCREEN
    ====================================== -->

    <div id="startScreen">

        <h1>LocalSync</h1>

        <p>
            Point your camera at the<br>
            LocalSync business card
        </p>

        <button id="startButton">
            START AR
        </button>

    </div>


    <!-- ======================================
         STATUS
    ====================================== -->

    <div id="status">
        Starting camera...
    </div>


    <!-- ======================================
         ERROR BOX
    ====================================== -->

    <div id="errorBox">

        <h2>Camera Error</h2>

        <p id="errorText">
            Unable to start the camera.
        </p>

        <button id="retryButton">
            TRY AGAIN
        </button>

    </div>


    <!-- ======================================
         MINDAR SCENE
    ====================================== -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            autoStart: false;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- CAMERA -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        ></a-camera>


        <!-- ==================================
             LOCALSYNC TARGET
        ================================== -->

        <a-entity

            id="localSyncTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- LOCALSYNC -->

            <a-text

                value="LocalSync"

                position="0 0.20 0.10"

                align="center"

                width="0.95"

                color="#8fd3ff"

                side="double"

            ></a-text>


            <!-- TAGLINE -->

            <a-text

                value="LOCAL • CONNECTED • SMART"

                position="0 0.08 0.10"

                align="center"

                width="0.55"

                color="#c5d3e0"

                side="double"

            ></a-text>


            <!-- OPEN APP -->

            <a-plane

                id="openAppButton"

                class="clickable"

                position="0 -0.08 0.10"

                width="0.65"

                height="0.15"

                color="#1669c9"

            ></a-plane>


            <a-text

                value="OPEN APP"

                position="0 -0.08 0.12"

                align="center"

                width="0.52"

                color="#ffffff"

                side="double"

            ></a-text>


            <!-- VISIT WEBSITE -->

            <a-plane

                id="websiteButton"

                class="clickable"

                position="0 -0.27 0.10"

                width="0.65"

                height="0.15"

                color="#152b45"

            ></a-plane>


            <a-text

                value="VISIT WEBSITE"

                position="0 -0.27 0.12"

                align="center"

                width="0.48"

                color="#ffffff"

                side="double"

            ></a-text>


        </a-entity>


    </a-scene>


    <!-- ======================================
         JAVASCRIPT
    ====================================== -->

    <script>


        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


        const APP_URL = "";


        const scene =
            document.querySelector("#arScene");


        const startScreen =
            document.querySelector("#startScreen");


        const startButton =
            document.querySelector("#startButton");


        const status =
            document.querySelector("#status");


        const errorBox =
            document.querySelector("#errorBox");


        const errorText =
            document.querySelector("#errorText");


        const retryButton =
            document.querySelector("#retryButton");


        const websiteButton =
            document.querySelector("#websiteButton");


        const openAppButton =
            document.querySelector("#openAppButton");


        let arSystem = null;


        /* ======================================
           GET MINDAR SYSTEM
        ====================================== */

        scene.addEventListener(
            "loaded",
            () => {

                console.log(
                    "LocalSync: A-Frame loaded"
                );


                arSystem =
                    scene.systems[
                        "mindar-image-system"
                    ];

            }
        );


        /* ======================================
           SHOW ERROR
        ====================================== */

        function showError(message) {

            console.error(
                "LocalSync AR ERROR:",
                message
            );


            status.style.display =
                "none";


            errorText.textContent =
                message;


            errorBox.style.display =
                "block";

        }


        /* ======================================
           HIDE ERROR
        ====================================== */

        function hideError() {

            errorBox.style.display =
                "none";

        }


        /* ======================================
           FIND MINDAR VIDEO
        ====================================== */

        function getMindARVideo() {

            const videos =
                document.querySelectorAll(
                    "video"
                );


            console.log(
                "LocalSync: videos found =",
                videos.length
            );


            if (videos.length === 0) {

                return null;

            }


            return videos[0];

        }


        /* ======================================
           FORCE VIDEO PLAY
        ====================================== */

        async function forceVideoPlay() {

            const video =
                getMindARVideo();


            if (!video) {

                throw new Error(
                    "MindAR started, but no camera video element was created."
                );

            }


            console.log(
                "LocalSync: video element found"
            );


            console.log(
                "Video readyState:",
                video.readyState
            );


            console.log(
                "Video paused:",
                video.paused
            );


            console.log(
                "Video dimensions:",
                video.videoWidth,
                "x",
                video.videoHeight
            );


            /*
             * Mobile browser requirements
             */

            video.autoplay =
                true;

            video.muted =
                true;

            video.playsInline =
                true;

            video.setAttribute(
                "autoplay",
                ""
            );

            video.setAttribute(
                "muted",
                ""
            );

            video.setAttribute(
                "playsinline",
                ""
            );


            /*
             * Explicitly play camera video.
             */

            try {

                await video.play();

                console.log(
                    "LocalSync: video.play() SUCCESS"
                );

            }

            catch (error) {

                console.error(
                    "LocalSync: video.play() FAILED",
                    error
                );


                throw new Error(
                    "Camera stream exists but the browser refused to play it: "
                    +
                    error.message
                );

            }


            /*
             * Verify actual video dimensions.
             */

            if (
                video.videoWidth === 0 ||
                video.videoHeight === 0
            ) {

                console.warn(
                    "LocalSync: video has no dimensions yet."
                );

            }


            return video;

        }


        /* ======================================
           START AR
        ====================================== */

        async function startAR() {

            hideError();


            startButton.disabled =
                true;


            startButton.textContent =
                "STARTING...";


            status.style.display =
                "block";


            status.textContent =
                "Requesting camera...";


            try {


                /*
                 * Get MindAR system
                 */

                if (!arSystem) {

                    arSystem =
                        scene.systems[
                            "mindar-image-system"
                        ];

                }


                if (!arSystem) {

                    throw new Error(
                        "MindAR system could not be created."
                    );

                }


                /*
                 * Start MindAR
                 */

                console.log(
                    "LocalSync: starting MindAR..."
                );


                await arSystem.start();


                console.log(
                    "LocalSync: MindAR start completed"
                );


                status.textContent =
                    "Activating camera...";


                /*
                 * Give the video element
                 * a moment to be created.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            300
                        )
                );


                /*
                 * Explicitly play video.
                 */

                await forceVideoPlay();


                /*
                 * Camera is now running.
                 */

                startScreen.style.display =
                    "none";


                status.style.display =
                    "none";


                console.log(
                    "LocalSync: CAMERA ACTIVE"
                );


            }

            catch (error) {

                showError(
                    error.message ||
                    "Unable to start the camera."
                );


                startButton.disabled =
                    false;


                startButton.textContent =
                    "START AR";

            }

        }


        /* ======================================
           START BUTTON
        ====================================== */

        startButton.addEventListener(
            "click",
            startAR
        );


        /* ======================================
           RETRY
        ====================================== */

        retryButton.addEventListener(
            "click",
            () => {

                hideError();

                startAR();

            }
        );


        /* ======================================
           AR READY
        ====================================== */

        scene.addEventListener(
            "arReady",
            () => {

                console.log(
                    "LocalSync: AR READY"
                );

            }
        );


        /* ======================================
           AR ERROR
        ====================================== */

        scene.addEventListener(
            "arError",
            event => {

                console.error(
                    "LocalSync: AR ERROR",
                    event
                );

            }
        );


        /* ======================================
           TARGET FOUND
        ====================================== */

        const target =
            document.querySelector(
                "#localSyncTarget"
            );


        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "LocalSync: TARGET FOUND"
                );

            }
        );


        /* ======================================
           TARGET LOST
        ====================================== */

        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "LocalSync: TARGET LOST"
                );

            }
        );


        /* ======================================
           WEBSITE
        ====================================== */

        websiteButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    WEBSITE_URL;

            }
        );


        /* ======================================
           APP
        ====================================== */

        openAppButton.addEventListener(
            "click",
            () => {

                if (
                    APP_URL.trim() !== ""
                ) {

                    window.location.href =
                        APP_URL;

                }

                else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            }
        );


    </script>


</body>

</html>
