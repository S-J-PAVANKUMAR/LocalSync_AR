<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LocalSync AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }
    </style>
</head>

<body>

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            uiScanning: yes;
            uiLoading: yes;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <!-- CAMERA -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        >

            <a-entity
                cursor="rayOrigin: mouse; fuse: false"
                raycaster="objects: .clickable"
            ></a-entity>

        </a-camera>


        <!-- AR TARGET -->

        <a-entity mindar-image-target="targetIndex: 0">

            <!-- LOCALSYNC -->

            <a-text
                value="LocalSync"
                position="0 0.20 0.10"
                align="center"
                width="0.95"
                color="#8fd3ff"
                side="double"
            ></a-text>


            <!-- TAGLINE -->

            <a-text
                value="LOCAL • CONNECTED • SMART"
                position="0 0.08 0.10"
                align="center"
                width="0.55"
                color="#c5d3e0"
                side="double"
            ></a-text>


            <!-- OPEN APP -->

            <a-plane
                id="openAppButton"
                class="clickable"
                position="0 -0.08 0.10"
                width="0.65"
                height="0.15"
                color="#1669c9"
            ></a-plane>

            <a-text
                value="OPEN APP"
                position="0 -0.08 0.12"
                align="center"
                width="0.52"
                color="#ffffff"
                side="double"
            ></a-text>


            <!-- VISIT WEBSITE -->

            <a-plane
                id="websiteButton"
                class="clickable"
                position="0 -0.27 0.10"
                width="0.65"
                height="0.15"
                color="#152b45"
            ></a-plane>

            <a-text
                value="VISIT WEBSITE"
                position="0 -0.27 0.12"
                align="center"
                width="0.48"
                color="#ffffff"
                side="double"
            ></a-text>

        </a-entity>

    </a-scene>


    <!-- JAVASCRIPT -->

    <script>

        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";

        const APP_URL = "";


        document.addEventListener("DOMContentLoaded", () => {

            const websiteButton =
                document.querySelector("#websiteButton");

            const openAppButton =
                document.querySelector("#openAppButton");


            websiteButton.addEventListener("click", () => {

                window.location.href = WEBSITE_URL;

            });


            openAppButton.addEventListener("click", () => {

                if (APP_URL.trim() !== "") {

                    window.location.href = APP_URL;

                } else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            });

        });

    </script>

</body>

</html>
