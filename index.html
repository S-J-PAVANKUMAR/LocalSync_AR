<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>LocalSync AR</title>


    <!-- =========================================
         A-FRAME 1.5.0
    ========================================== -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- =========================================
         MINDAR 1.2.5
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            touch-action: none;

        }


        a-scene {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


    <!-- =========================================
         MINDAR AR SCENE
    ========================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- =====================================
             CAMERA
        ====================================== -->

        <a-camera

            id="arCamera"

            position="0 0 0"

            look-controls="enabled: false"

        ></a-camera>



        <!-- =====================================
             LOCALSYNC TARGET
        ====================================== -->

        <a-entity

            id="localSyncTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- =================================
                 LOCALSYNC TITLE
            ================================== -->

            <a-text

                value="LocalSync"

                position="0 0.24 0.10"

                align="center"

                width="1.20"

                color="#8fd3ff"

                side="double"

            ></a-text>



            <!-- =================================
                 TAGLINE
            ================================== -->

            <a-text

                value="LOCAL • CONNECTED • SMART"

                position="0 0.10 0.10"

                align="center"

                width="0.68"

                color="#d7e4ef"

                side="double"

            ></a-text>



            <!-- =================================
                 OPEN APP AR BUTTON
            ================================== -->

            <a-plane

                id="openAppAR"

                class="ar-button"

                position="0 -0.08 0.12"

                width="0.90"

                height="0.22"

                color="#176dcc"

                material="
                    shader: flat;
                    opacity: 0.96;
                "

            ></a-plane>


            <!-- OPEN APP TEXT -->

            <a-text

                value="OPEN APP"

                position="0 -0.08 0.15"

                align="center"

                width="0.72"

                color="#ffffff"

                side="double"

            ></a-text>



            <!-- =================================
                 VISIT WEBSITE AR BUTTON
            ================================== -->

            <a-plane

                id="websiteAR"

                class="ar-button"

                position="0 -0.36 0.12"

                width="0.90"

                height="0.22"

                color="#152b45"

                material="
                    shader: flat;
                    opacity: 0.96;
                "

            ></a-plane>


            <!-- WEBSITE TEXT -->

            <a-text

                value="VISIT WEBSITE"

                position="0 -0.36 0.15"

                align="center"

                width="0.68"

                color="#ffffff"

                side="double"

            ></a-text>


        </a-entity>


    </a-scene>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* ========================================
           WEBSITE URL
        ======================================== */

        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


        /* ========================================
           FLUTTER APP URL

           We will add the real deep link later.
        ======================================== */

        const APP_URL = "";



        /* ========================================
           A-FRAME SCENE
        ======================================== */

        const scene =
            document.querySelector("a-scene");


        const openAppButton =
            document.querySelector("#openAppAR");


        const websiteButton =
            document.querySelector("#websiteAR");



        /* ========================================
           THREE.JS RAYCASTER
        ======================================== */

        const raycaster =
            new THREE.Raycaster();


        const touchPoint =
            new THREE.Vector2();



        /* ========================================
           FIND AR BUTTON FROM
           INTERSECTED THREE.JS OBJECT
        ======================================== */

        function findARButton(object) {

            let current =
                object;


            while (current) {

                if (
                    current.el &&
                    current.el.classList &&
                    current.el.classList.contains(
                        "ar-button"
                    )
                ) {

                    return current.el;

                }


                current =
                    current.parent;

            }


            return null;

        }



        /* ========================================
           HANDLE PHONE TOUCH
        ======================================== */

        function handleTouch(event) {

            if (!scene.canvas) {

                return;

            }


            if (
                !scene.camera
            ) {

                return;

            }


            const touch =
                event.changedTouches[0];


            const rect =
                scene.canvas.getBoundingClientRect();


            /* Convert phone touch
               into normalized
               device coordinates */

            touchPoint.x =
                (
                    (touch.clientX - rect.left)
                    /
                    rect.width
                ) * 2 - 1;


            touchPoint.y =
                -(
                    (touch.clientY - rect.top)
                    /
                    rect.height
                ) * 2 + 1;



            /* Create ray from camera */

            raycaster.setFromCamera(
                touchPoint,
                scene.camera
            );



            /* Find AR button objects */

            const buttons = [

                openAppButton.object3D,

                websiteButton.object3D

            ];



            const intersections =
                raycaster.intersectObjects(
                    buttons,
                    true
                );



            if (
                intersections.length === 0
            ) {

                return;

            }



            /* Find which AR button
               was touched */

            const button =
                findARButton(
                    intersections[0].object
                );


            if (!button) {

                return;

            }



            /* Stop browser handling */

            event.preventDefault();



            /* Trigger button action */

            if (
                button.id === "websiteAR"
            ) {

                console.log(
                    "LocalSync AR: VISIT WEBSITE tapped"
                );


                window.location.href =
                    WEBSITE_URL;

            }


            else if (
                button.id === "openAppAR"
            ) {

                console.log(
                    "LocalSync AR: OPEN APP tapped"
                );


                if (
                    APP_URL.trim() !== ""
                ) {

                    window.location.href =
                        APP_URL;

                }

                else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            }

        }



        /* ========================================
           WAIT FOR A-FRAME TO LOAD
        ======================================== */

        scene.addEventListener(

            "loaded",

            () => {

                console.log(
                    "LocalSync AR scene loaded"
                );


                /* Touch listener */

                scene.canvas.addEventListener(

                    "touchend",

                    handleTouch,

                    {
                        passive: false
                    }

                );


                console.log(
                    "LocalSync AR touch interaction ready"
                );

            }

        );


    </script>


</body>

</html>
