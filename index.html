<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LocalSync AR</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #10283b 0%,
                    #050b12 60%,
                    #000 100%
                );

            color: white;
            text-align: center;
        }

        #startScreen h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        #startScreen p {
            margin: 0 25px 28px;
            color: #b9c8d5;
            line-height: 1.5;
        }

        #startButton {
            border: 0;
            border-radius: 14px;
            padding: 15px 36px;

            background: #176dcc;
            color: white;

            font-size: 16px;
            font-weight: bold;
        }

        #startButton:active {
            transform: scale(0.96);
        }

        #status {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 20;

            display: none;

            padding: 9px 16px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-size: 13px;
        }

        #errorBox {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.9);
        }

        #errorCard {
            width: 80%;
            max-width: 350px;

            padding: 25px;

            border-radius: 18px;

            background: #07111d;
            color: white;

            text-align: center;
        }

        #errorText {
            color: #c5d3e0;
            line-height: 1.5;
            word-break: break-word;
        }

        #retryButton {
            border: 0;
            border-radius: 10px;

            padding: 12px 24px;

            background: #176dcc;
            color: white;

            font-weight: bold;
        }

        #scanMessage {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            z-index: 20;

            display: none;

            padding: 10px 18px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.65);
            color: white;

            font-size: 14px;
            white-space: nowrap;
        }

        #actions {
            position: fixed;

            left: 50%;
            bottom: 70px;

            transform: translateX(-50%);

            z-index: 30;

            display: none;

            flex-direction: column;

            gap: 10px;

            width: 210px;
        }

        .actionButton {
            border: 0;
            border-radius: 12px;

            padding: 13px;

            color: white;

            font-size: 14px;
            font-weight: bold;
        }

        #openAppButton {
            background: #176dcc;
        }

        #websiteButton {
            background: #152b45;
        }

    </style>
</head>


<body>


    <div id="container"></div>


    <div id="startScreen">

        <h1>LocalSync</h1>

        <p>
            Point your camera at the<br>
            LocalSync business card
        </p>

        <button id="startButton">
            START AR
        </button>

    </div>


    <div id="status">
        Starting camera...
    </div>


    <div id="scanMessage">
        Point the camera at your LocalSync card
    </div>


    <div id="actions">

        <button
            id="openAppButton"
            class="actionButton"
        >
            OPEN APP
        </button>

        <button
            id="websiteButton"
            class="actionButton"
        >
            VISIT WEBSITE
        </button>

    </div>


    <div id="errorBox">

        <div id="errorCard">

            <h2>AR Camera Error</h2>

            <p id="errorText">
                Unable to start AR.
            </p>

            <button id="retryButton">
                TRY AGAIN
            </button>

        </div>

    </div>


    <script type="module">

        import * as THREE from "three";

        import {
            MindARThree
        } from "mindar-image-three";


        /* =====================================
           CONFIG
        ===================================== */

        const TARGET =
            "./targets/localsync-card.mind";

        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";

        const APP_URL = "";


        /* =====================================
           ELEMENTS
        ===================================== */

        const container =
            document.querySelector("#container");

        const startScreen =
            document.querySelector("#startScreen");

        const startButton =
            document.querySelector("#startButton");

        const status =
            document.querySelector("#status");

        const scanMessage =
            document.querySelector("#scanMessage");

        const actions =
            document.querySelector("#actions");

        const errorBox =
            document.querySelector("#errorBox");

        const errorText =
            document.querySelector("#errorText");

        const retryButton =
            document.querySelector("#retryButton");

        const openAppButton =
            document.querySelector("#openAppButton");

        const websiteButton =
            document.querySelector("#websiteButton");


        let mindarThree = null;


        /* =====================================
           FIND REAR CAMERA
        ===================================== */

        async function findRearCamera() {

            const devices =
                await navigator.mediaDevices.enumerateDevices();


            const cameras =
                devices.filter(
                    device =>
                        device.kind === "videoinput"
                );


            console.log(
                "LocalSync cameras:",
                cameras
            );


            if (cameras.length === 0) {

                throw new Error(
                    "No camera was found on this device."
                );

            }


            /*
             * Prefer a camera whose label indicates
             * the rear/environment camera.
             */

            const rearCamera =
                cameras.find(
                    camera => {

                        const label =
                            camera.label.toLowerCase();

                        return (
                            label.includes("back") ||
                            label.includes("rear") ||
                            label.includes("environment") ||
                            label.includes("world")
                        );

                    }
                );


            /*
             * If Android doesn't expose labels,
             * use the last available camera.
             */

            const selectedCamera =
                rearCamera ||
                cameras[cameras.length - 1];


            console.log(
                "LocalSync selected camera:",
                selectedCamera.label,
                selectedCamera.deviceId
            );


            return selectedCamera.deviceId;

        }


        /* =====================================
           CREATE MINDAR
        ===================================== */

        function createMindAR(
            environmentDeviceId
        ) {

            console.log(
                "Creating MindAR with rear camera:",
                environmentDeviceId
            );


            mindarThree =
                new MindARThree({

                    container:

                        container,

                    imageTargetSrc:

                        TARGET,

                    maxTrack:

                        1,

                    environmentDeviceId:

                        environmentDeviceId,

                    resolution:

                        "720p",

                    uiLoading:

                        "no",

                    uiScanning:

                        "no",

                    uiError:

                        "no"

                });


            const {
                renderer,
                scene,
                camera
            } = mindarThree;


            /*
             * Simple AR object.
             *
             * This is only a tracking test.
             */

            const geometry =
                new THREE.BoxGeometry(
                    0.18,
                    0.18,
                    0.18
                );


            const material =
                new THREE.MeshNormalMaterial();


            const cube =
                new THREE.Mesh(
                    geometry,
                    material
                );


            const anchor =
                mindarThree.addAnchor(0);


            anchor.group.add(cube);


            /*
             * Target found
             */

            anchor.onTargetFound =
                () => {

                    console.log(
                        "LocalSync: TARGET FOUND"
                    );


                    scanMessage.style.display =
                        "none";


                    actions.style.display =
                        "flex";

                };


            /*
             * Target lost
             */

            anchor.onTargetLost =
                () => {

                    console.log(
                        "LocalSync: TARGET LOST"
                    );


                    actions.style.display =
                        "none";


                    scanMessage.style.display =
                        "block";

                };


            /*
             * Render loop
             */

            renderer.setAnimationLoop(
                () => {

                    renderer.render(
                        scene,
                        camera
                    );

                }
            );

        }


        /* =====================================
           START AR
        ===================================== */

        async function startAR() {

            try {

                startButton.disabled =
                    true;

                startButton.textContent =
                    "STARTING...";


                status.style.display =
                    "block";

                status.textContent =
                    "Finding rear camera...";


                /*
                 * Ask for camera permission first.
                 *
                 * This also makes camera labels
                 * available to enumerateDevices().
                 */

                const permissionStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: {
                                ideal:
                                    "environment"
                            }
                        },

                        audio: false

                    });


                /*
                 * Immediately release this temporary
                 * stream. MindAR will open the selected
                 * camera itself.
                 */

                permissionStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                /*
                 * Find actual rear camera.
                 */

                const rearCameraId =
                    await findRearCamera();


                status.textContent =
                    "Starting LocalSync AR...";


                /*
                 * Create MindAR with explicit
                 * environment camera.
                 */

                createMindAR(
                    rearCameraId
                );


                /*
                 * Start MindAR.
                 */

                await mindarThree.start();


                console.log(
                    "LocalSync: AR started successfully"
                );


                startScreen.style.display =
                    "none";


                status.style.display =
                    "none";


                scanMessage.style.display =
                    "block";


            }

            catch (error) {

                console.error(
                    "LocalSync AR ERROR:",
                    error
                );


                errorText.textContent =
                    error.message ||
                    "Unable to start camera.";


                errorBox.style.display =
                    "flex";


                startButton.disabled =
                    false;

                startButton.textContent =
                    "START AR";

            }

        }


        /* =====================================
           START
        ===================================== */

        startButton.addEventListener(
            "click",
            startAR
        );


        /* =====================================
           RETRY
        ===================================== */

        retryButton.addEventListener(
            "click",
            () => {

                location.reload();

            }
        );


        /* =====================================
           WEBSITE
        ===================================== */

        websiteButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    WEBSITE_URL;

            }
        );


        /* =====================================
           APP
        ===================================== */

        openAppButton.addEventListener(
            "click",
            () => {

                if (
                    APP_URL.trim() !== ""
                ) {

                    window.location.href =
                        APP_URL;

                }

                else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            }
        );


    </script>

</body>

</html>
