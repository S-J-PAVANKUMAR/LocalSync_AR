<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LocalSync AR</title>


    <!-- =========================================
         THREE.JS + MINDAR
    ========================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;

        }


        /* =========================================
           AR CONTAINER
        ========================================== */

        #container {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;

        }


        #container video {

            position: absolute !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            object-fit: cover !important;

        }


        #container canvas {

            position: absolute !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

        }


        /* =========================================
           START SCREEN
        ========================================== */

        #startScreen {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #10283b 0%,
                    #050b12 60%,
                    #000 100%
                );

        }


        #startScreen h1 {

            margin: 0 0 12px;

            font-size: 34px;

            letter-spacing: 1px;

        }


        #startScreen p {

            margin: 0 25px 28px;

            color: #b9c8d5;

            line-height: 1.5;

            font-size: 15px;

        }


        #startButton {

            border: none;

            border-radius: 14px;

            padding: 15px 36px;

            background: #176dcc;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #startButton:active {

            transform: scale(0.96);

        }


        /* =========================================
           STATUS
        ========================================== */

        #status {

            position: fixed;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 90;

            display: none;

            padding: 9px 16px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.70);

            color: white;

            font-size: 13px;

            white-space: nowrap;

        }


        /* =========================================
           SCAN MESSAGE
        ========================================== */

        #scanMessage {

            position: fixed;

            left: 50%;

            bottom: 30px;

            transform: translateX(-50%);

            z-index: 80;

            display: none;

            padding: 10px 18px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 14px;

            text-align: center;

            white-space: nowrap;

        }


        /* =========================================
           AR ACTION PANEL
        ========================================== */

        #actionPanel {

            position: fixed;

            left: 50%;

            bottom: 55px;

            transform: translateX(-50%);

            z-index: 80;

            display: none;

            flex-direction: column;

            gap: 10px;

            width: 210px;

        }


        .actionButton {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 13px 20px;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.35);

        }


        #openAppButton {

            background: #176dcc;

        }


        #websiteButton {

            background: #152b45;

        }


        .actionButton:active {

            transform: scale(0.96);

        }


        /* =========================================
           ERROR
        ========================================== */

        #errorBox {

            position: fixed;

            inset: 0;

            z-index: 200;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background: rgba(0, 0, 0, 0.88);

        }


        #errorCard {

            width: 100%;

            max-width: 360px;

            padding: 25px;

            border-radius: 18px;

            background: #07111d;

            color: white;

            text-align: center;

        }


        #errorCard h2 {

            margin-top: 0;

        }


        #errorText {

            color: #c5d3e0;

            font-size: 14px;

            line-height: 1.5;

            word-break: break-word;

        }


        #retryButton {

            border: none;

            border-radius: 10px;

            padding: 12px 24px;

            background: #176dcc;

            color: white;

            font-weight: bold;

        }

    </style>

</head>


<body>


    <!-- =========================================
         AR CONTAINER
    ========================================== -->

    <div id="container"></div>


    <!-- =========================================
         START SCREEN
    ========================================== -->

    <div id="startScreen">

        <h1>LocalSync</h1>

        <p>
            Point your camera at the<br>
            LocalSync business card
        </p>

        <button id="startButton">
            START AR
        </button>

    </div>


    <!-- =========================================
         STATUS
    ========================================== -->

    <div id="status">
        Starting camera...
    </div>


    <!-- =========================================
         SCAN MESSAGE
    ========================================== -->

    <div id="scanMessage">
        Point the camera at your LocalSync card
    </div>


    <!-- =========================================
         ACTIONS
    ========================================== -->

    <div id="actionPanel">

        <button
            id="openAppButton"
            class="actionButton"
        >
            OPEN APP
        </button>


        <button
            id="websiteButton"
            class="actionButton"
        >
            VISIT WEBSITE
        </button>

    </div>


    <!-- =========================================
         ERROR
    ========================================== -->

    <div id="errorBox">

        <div id="errorCard">

            <h2>AR Camera Error</h2>

            <p id="errorText">
                Unable to start LocalSync AR.
            </p>

            <button id="retryButton">
                TRY AGAIN
            </button>

        </div>

    </div>


    <!-- =========================================
         THREE.JS / MINDAR
    ========================================== -->

    <script type="module">

        import * as THREE from "three";

        import {
            MindARThree
        } from "mindar-image-three";


        /* ========================================
           CONFIGURATION
        ======================================== */

        const TARGET_URL =
            "./targets/localsync-card.mind";


        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


        /*
         * Real Flutter deep link will be added later.
         */

        const APP_URL = "";


        /* ========================================
           HTML ELEMENTS
        ======================================== */

        const container =
            document.querySelector("#container");


        const startScreen =
            document.querySelector("#startScreen");


        const startButton =
            document.querySelector("#startButton");


        const status =
            document.querySelector("#status");


        const scanMessage =
            document.querySelector("#scanMessage");


        const actionPanel =
            document.querySelector("#actionPanel");


        const openAppButton =
            document.querySelector("#openAppButton");


        const websiteButton =
            document.querySelector("#websiteButton");


        const errorBox =
            document.querySelector("#errorBox");


        const errorText =
            document.querySelector("#errorText");


        const retryButton =
            document.querySelector("#retryButton");


        /* ========================================
           MINDAR
        ======================================== */

        let mindarThree = null;

        let targetAnchor = null;


        /* ========================================
           CREATE AR
        ======================================== */

        function createAR() {

            console.log(
                "LocalSync: creating MindARThree"
            );


            mindarThree =
                new MindARThree({

                    container: container,

                    imageTargetSrc:
                        TARGET_URL,

                    maxTrack: 1,

                    uiLoading: "no",

                    uiScanning: "no",

                    uiError: "no"

                });


            /*
             * Three.js objects
             */

            const {
                renderer,
                scene,
                camera
            } = mindarThree;


            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio,
                    2
                )
            );


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            /*
             * Transparent renderer
             */

            renderer.setClearColor(
                0x000000,
                0
            );


            /* =====================================
               TARGET ANCHOR
            ===================================== */

            targetAnchor =
                mindarThree.addAnchor(0);


            /*
             * Create a simple premium AR panel.
             */

            const panelGeometry =
                new THREE.PlaneGeometry(
                    0.72,
                    0.40
                );


            const panelMaterial =
                new THREE.MeshBasicMaterial({

                    color: 0x07111d,

                    transparent: true,

                    opacity: 0.92,

                    side: THREE.DoubleSide

                });


            const panel =
                new THREE.Mesh(
                    panelGeometry,
                    panelMaterial
                );


            panel.position.set(
                0,
                0,
                0.08
            );


            targetAnchor.group.add(
                panel
            );


            /*
             * LocalSync title
             */

            const titleTexture =
                createTextTexture(
                    "LocalSync",
                    "#8fd3ff",
                    900,
                    180
                );


            const titleMaterial =
                new THREE.MeshBasicMaterial({

                    map: titleTexture,

                    transparent: true,

                    side: THREE.DoubleSide

                });


            const title =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        0.58,
                        0.115
                    ),

                    titleMaterial

                );


            title.position.set(
                0,
                0.105,
                0.095
            );


            targetAnchor.group.add(
                title
            );


            /*
             * Tagline
             */

            const taglineTexture =
                createTextTexture(
                    "LOCAL • CONNECTED • SMART",
                    "#c5d3e0",
                    1000,
                    120
                );


            const taglineMaterial =
                new THREE.MeshBasicMaterial({

                    map: taglineTexture,

                    transparent: true,

                    side: THREE.DoubleSide

                });


            const tagline =
                new THREE.Mesh(

                    new THREE.PlaneGeometry(
                        0.55,
                        0.065
                    ),

                    taglineMaterial

                );


            tagline.position.set(
                0,
                0.035,
                0.095
            );


            targetAnchor.group.add(
                tagline
            );


            /*
             * Target found
             */

            targetAnchor.onTargetFound = () => {

                console.log(
                    "LocalSync: TARGET FOUND"
                );


                scanMessage.style.display =
                    "none";


                actionPanel.style.display =
                    "flex";

            };


            /*
             * Target lost
             */

            targetAnchor.onTargetLost = () => {

                console.log(
                    "LocalSync: TARGET LOST"
                );


                actionPanel.style.display =
                    "none";


                scanMessage.style.display =
                    "block";

            };


            /*
             * Resize
             */

            window.addEventListener(
                "resize",
                () => {

                    renderer.setSize(
                        window.innerWidth,
                        window.innerHeight
                    );

                }
            );

        }


        /* ========================================
           TEXT TEXTURE
        ======================================== */

        function createTextTexture(
            text,
            color,
            width,
            height
        ) {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                width;

            canvas.height =
                height;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            ctx.fillStyle =
                color;


            ctx.font =
                "bold 90px Arial";


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            ctx.fillText(
                text,
                width / 2,
                height / 2
            );


            const texture =
                new THREE.CanvasTexture(
                    canvas
                );


            texture.needsUpdate =
                true;


            return texture;

        }


        /* ========================================
           ERROR
        ======================================== */

        function showError(
            message
        ) {

            console.error(
                "LocalSync:",
                message
            );


            errorText.textContent =
                message;


            errorBox.style.display =
                "flex";


            status.style.display =
                "none";

        }


        /* ========================================
           START AR
        ======================================== */

        async function startAR() {

            try {

                startButton.disabled =
                    true;


                startButton.textContent =
                    "STARTING...";


                status.style.display =
                    "block";


                status.textContent =
                    "Starting camera...";


                /*
                 * Create only once.
                 */

                if (!mindarThree) {

                    createAR();

                }


                /*
                 * Start MindAR.
                 *
                 * This is the official
                 * Three.js lifecycle.
                 */

                await mindarThree.start();


                console.log(
                    "LocalSync: MindAR started"
                );


                /*
                 * Start rendering.
                 */

                const {
                    renderer,
                    scene,
                    camera
                } = mindarThree;


                renderer.setAnimationLoop(
                    () => {

                        renderer.render(
                            scene,
                            camera
                        );

                    }
                );


                /*
                 * Hide start screen.
                 */

                startScreen.style.display =
                    "none";


                status.style.display =
                    "none";


                scanMessage.style.display =
                    "block";


                console.log(
                    "LocalSync: AR CAMERA ACTIVE"
                );

            }

            catch (error) {

                console.error(
                    "LocalSync AR startup failed:",
                    error
                );


                showError(
                    error?.message ||
                    "MindAR could not start."
                );


                startButton.disabled =
                    false;


                startButton.textContent =
                    "START AR";

            }

        }


        /* ========================================
           START BUTTON
        ======================================== */

        startButton.addEventListener(
            "click",
            startAR
        );


        /* ========================================
           RETRY
        ======================================== */

        retryButton.addEventListener(
            "click",
            () => {

                location.reload();

            }
        );


        /* ========================================
           WEBSITE
        ======================================== */

        websiteButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    WEBSITE_URL;

            }
        );


        /* ========================================
           APP
        ======================================== */

        openAppButton.addEventListener(
            "click",
            () => {

                if (
                    APP_URL.trim() !== ""
                ) {

                    window.location.href =
                        APP_URL;

                }

                else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            }
        );


        console.log(
            "LocalSync AR: Three.js engine loaded"
        );

    </script>


</body>

</html>
