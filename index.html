<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LocalSync AR</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

    </style>

</head>


<body>


<a-scene
    mindar-image="
        imageTargetSrc: ./targets/localsync-card.mind;
        maxTrack: 1;
        uiScanning: yes;
        uiLoading: yes;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
>


    <!-- ========================================= -->
    <!-- CAMERA -->
    <!-- ========================================= -->

    <a-camera
        position="0 0 0"
        look-controls="enabled: false"
    >

        <a-entity
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable"
        ></a-entity>

    </a-camera>



    <!-- ========================================= -->
    <!-- LOCALSYNC TARGET -->
    <!-- ========================================= -->

    <a-entity
        mindar-image-target="targetIndex: 0"
    >


        <!-- ===================================== -->
        <!-- LOCALSYNC LOGO -->
        <!-- ===================================== -->

        <!-- Subtle shadow -->
        <a-text
            value="LocalSync"
            position="0.012 0.205 0.075"
            align="center"
            width="1.05"
            color="#172638"
            side="double"
        ></a-text>


        <!-- Main logo -->
        <a-text
            value="LocalSync"
            position="0 0.22 0.10"
            align="center"
            width="1.05"
            color="#e8f2ff"
            side="double"
        ></a-text>


        <!-- Small blue highlight -->
        <a-text
            value="LocalSync"
            position="0 0.225 0.105"
            align="center"
            width="1.05"
            color="#8fd3ff"
            opacity="0.55"
            side="double"
        ></a-text>



        <!-- ===================================== -->
        <!-- TAGLINE -->
        <!-- ===================================== -->

        <a-text
            value="LOCAL • CONNECTED • SMART"
            position="0 0.095 0.10"
            align="center"
            width="0.65"
            color="#9fb2c5"
            side="double"
        ></a-text>



        <!-- ===================================== -->
        <!-- OPEN APP BUTTON -->
        <!-- ===================================== -->

        <!-- Shadow -->
        <a-plane
            position="0.012 -0.075 0.075"
            width="0.72"
            height="0.16"
            color="#07111d"
        ></a-plane>


        <!-- Button -->
        <a-plane
            class="clickable"
            id="openAppButton"
            position="0 -0.06 0.10"
            width="0.72"
            height="0.16"
            color="#1669c9"
        ></a-plane>


        <!-- Button highlight -->
        <a-plane
            position="0 0.005 0.115"
            width="0.62"
            height="0.008"
            color="#8acbff"
            opacity="0.75"
        ></a-plane>


        <!-- Button text -->
        <a-text
            value="OPEN APP"
            position="0 -0.06 0.125"
            align="center"
            width="0.60"
            color="#ffffff"
            side="double"
        ></a-text>



        <!-- ===================================== -->
        <!-- VISIT WEBSITE BUTTON -->
        <!-- ===================================== -->

        <!-- Shadow -->
        <a-plane
            position="0.012 -0.285 0.075"
            width="0.72"
            height="0.16"
            color="#07111d"
        ></a-plane>


        <!-- Button -->
        <a-plane
            class="clickable"
            id="websiteButton"
            position="0 -0.27 0.10"
            width="0.72"
            height="0.16"
            color="#152b45"
        ></a-plane>


        <!-- Button highlight -->
        <a-plane
            position="0 -0.205 0.115"
            width="0.62"
            height="0.008"
            color="#2498ff"
            opacity="0.80"
        ></a-plane>


        <!-- Button text -->
        <a-text
            value="VISIT WEBSITE"
            position="0 -0.27 0.125"
            align="center"
            width="0.52"
            color="#ffffff"
            side="double"
        ></a-text>


    </a-entity>


</a-scene>



<!-- ============================================= -->
<!-- JAVASCRIPT -->
<!-- ============================================= -->

<script>


    /*
     * ============================================
     * LOCALSYNC WEBSITE
     * ============================================
     */

    const WEBSITE_URL =
        "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


    /*
     * ============================================
     * LOCALSYNC APP
     *
     * We will add the real Flutter deep link
     * after the Android app link is ready.
     * ============================================
     */

    const APP_URL = "";



    /*
     * ============================================
     * BUTTON INTERACTION
     * ============================================
     */

    document.addEventListener("DOMContentLoaded", () => {


        const websiteButton =
            document.querySelector("#websiteButton");


        const openAppButton =
            document.querySelector("#openAppButton");



        /*
         * WEBSITE BUTTON
         */

        websiteButton.addEventListener("click", () => {

            window.location.href = WEBSITE_URL;

        });



        /*
         * OPEN APP BUTTON
         */

        openAppButton.addEventListener("click", () => {

            if (APP_URL.trim() !== "") {

                window.location.href = APP_URL;

            } else {

                alert(
                    "The LocalSync app link will be connected here."
                );

            }

        });


    });

</script>


</body>

</html>
