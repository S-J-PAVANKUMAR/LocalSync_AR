<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>LocalSync AR</title>


    <!-- A-Frame -->

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>


    <!-- MindAR -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

        }


        /*
         * IMPORTANT:
         *
         * Do NOT manually position the MindAR
         * video or A-Frame canvas.
         *
         * MindAR handles this itself.
         */


        #startScreen {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #10283b 0%,
                    #050b12 60%,
                    #000000 100%
                );

            color: white;

            text-align: center;

            z-index: 9999;

        }


        #startScreen h1 {

            margin: 0 0 12px;

            font-size: 32px;

            letter-spacing: 1px;

        }


        #startScreen p {

            margin: 0 25px 28px;

            color: #b9c8d5;

            font-size: 15px;

            line-height: 1.5;

        }


        #startButton {

            border: none;

            border-radius: 14px;

            padding: 15px 34px;

            background: #176dcc;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #startButton:active {

            transform: scale(0.96);

        }


        #errorMessage {

            display: none;

            position: fixed;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            width: 80%;

            max-width: 350px;

            padding: 20px;

            border-radius: 15px;

            background: rgba(0, 0, 0, 0.85);

            color: white;

            text-align: center;

            z-index: 10000;

        }

    </style>

</head>


<body>


    <!-- =====================================
         START SCREEN
    ====================================== -->

    <div id="startScreen">

        <h1>LocalSync</h1>

        <p>
            Point your camera at the<br>
            LocalSync business card
        </p>

        <button id="startButton">
            START AR
        </button>

    </div>


    <!-- =====================================
         ERROR
    ====================================== -->

    <div id="errorMessage">

        <h3>Camera Error</h3>

        <p id="errorText">
            Unable to start AR camera.
        </p>

        <button
            onclick="location.reload()"
            style="
                border:none;
                border-radius:10px;
                padding:12px 22px;
                background:#176dcc;
                color:white;
                font-weight:bold;
            "
        >
            TRY AGAIN
        </button>

    </div>


    <!-- =====================================
         MINDAR / A-FRAME
    ====================================== -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            autoStart: false;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- CAMERA -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        ></a-camera>


        <!-- =================================
             LOCALSYNC TARGET
        ================================== -->

        <a-entity

            id="localSyncTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- LOCALSYNC -->

            <a-text

                value="LocalSync"

                position="0 0.20 0.10"

                align="center"

                width="0.95"

                color="#8fd3ff"

                side="double"

            ></a-text>


            <!-- TAGLINE -->

            <a-text

                value="LOCAL • CONNECTED • SMART"

                position="0 0.08 0.10"

                align="center"

                width="0.55"

                color="#c5d3e0"

                side="double"

            ></a-text>


            <!-- OPEN APP -->

            <a-plane

                id="openAppButton"

                class="clickable"

                position="0 -0.08 0.10"

                width="0.65"

                height="0.15"

                color="#1669c9"

            ></a-plane>


            <a-text

                value="OPEN APP"

                position="0 -0.08 0.12"

                align="center"

                width="0.52"

                color="#ffffff"

                side="double"

            ></a-text>


            <!-- WEBSITE -->

            <a-plane

                id="websiteButton"

                class="clickable"

                position="0 -0.27 0.10"

                width="0.65"

                height="0.15"

                color="#152b45"

            ></a-plane>


            <a-text

                value="VISIT WEBSITE"

                position="0 -0.27 0.12"

                align="center"

                width="0.48"

                color="#ffffff"

                side="double"

            ></a-text>


        </a-entity>


    </a-scene>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


        const APP_URL = "";


        const scene =
            document.querySelector("#arScene");


        const startScreen =
            document.querySelector("#startScreen");


        const startButton =
            document.querySelector("#startButton");


        const errorMessage =
            document.querySelector("#errorMessage");


        const errorText =
            document.querySelector("#errorText");


        const websiteButton =
            document.querySelector("#websiteButton");


        const openAppButton =
            document.querySelector("#openAppButton");


        let arSystem = null;


        /*
         * Wait for A-Frame
         */

        scene.addEventListener(
            "loaded",
            () => {

                console.log(
                    "LocalSync: A-Frame loaded"
                );


                arSystem =
                    scene.systems[
                        "mindar-image-system"
                    ];

            }
        );


        /*
         * START AR
         */

        startButton.addEventListener(
            "click",
            async () => {

                console.log(
                    "LocalSync: START AR clicked"
                );


                startButton.disabled = true;

                startButton.textContent =
                    "STARTING...";


                try {


                    /*
                     * Get MindAR system
                     */

                    if (!arSystem) {

                        arSystem =
                            scene.systems[
                                "mindar-image-system"
                            ];

                    }


                    if (!arSystem) {

                        throw new Error(
                            "MindAR system not available."
                        );

                    }


                    /*
                     * Start MindAR
                     */

                    await arSystem.start();


                    console.log(
                        "LocalSync: camera started"
                    );


                    /*
                     * Hide start screen
                     */

                    startScreen.style.display =
                        "none";


                }

                catch (error) {

                    console.error(
                        "LocalSync AR error:",
                        error
                    );


                    errorText.textContent =
                        error.message ||
                        "Unable to start the AR camera.";


                    errorMessage.style.display =
                        "block";


                    startButton.disabled =
                        false;


                    startButton.textContent =
                        "START AR";

                }

            }
        );


        /*
         * AR READY
         */

        scene.addEventListener(
            "arReady",
            () => {

                console.log(
                    "LocalSync: AR READY"
                );

            }
        );


        /*
         * AR ERROR
         */

        scene.addEventListener(
            "arError",
            (event) => {

                console.error(
                    "LocalSync: AR ERROR",
                    event
                );

            }
        );


        /*
         * TARGET FOUND
         */

        const target =
            document.querySelector(
                "#localSyncTarget"
            );


        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "LocalSync: TARGET FOUND"
                );

            }
        );


        /*
         * TARGET LOST
         */

        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "LocalSync: TARGET LOST"
                );

            }
        );


        /*
         * WEBSITE BUTTON
         */

        websiteButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    WEBSITE_URL;

            }
        );


        /*
         * APP BUTTON
         */

        openAppButton.addEventListener(
            "click",
            () => {

                if (
                    APP_URL.trim() !== ""
                ) {

                    window.location.href =
                        APP_URL;

                }

                else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            }
        );


    </script>


</body>

</html>
