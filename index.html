<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalSync AR</title>

    <!-- A-Frame 1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR 1.2.5 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <!-- CAMERA -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- LOCALSYNC CARD TARGET -->
        <a-entity
            mindar-image-target="targetIndex: 0"
        >

            <!-- TEST OBJECT -->
            <a-box
                position="0 0 0.1"
                scale="0.2 0.2 0.2"
                color="#00ff88"
            ></a-box>

        </a-entity>

    </a-scene>

</body>
</html>
