<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalSync AR</title>


    <!-- A-Frame 1.5.0 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR 1.2.5 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

        }

    </style>

</head>


<body>


    <!-- =========================================
         MINDAR AR SCENE
    ========================================== -->

    <a-scene

        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            uiLoading: yes;
            uiScanning: yes;
            uiError: yes;
        "

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- =====================================
             CAMERA + MOBILE CURSOR
        ====================================== -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        >

            <!--
                A-Frame cursor creates the
                synthetic click events used
                by our AR buttons.
            -->

            <a-cursor

                fuse="false"

                raycaster="objects: .ar-button; far: 10"

            ></a-cursor>

        </a-camera>



        <!-- =====================================
             LOCALSYNC TARGET
        ====================================== -->

        <a-entity

            id="localSyncTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- =================================
                 LOCALSYNC TITLE
            ================================== -->

            <a-text

                value="LocalSync"

                position="0 0.24 0.10"

                align="center"

                width="1.20"

                color="#8fd3ff"

                side="double"

            ></a-text>



            <!-- =================================
                 TAGLINE
            ================================== -->

            <a-text

                value="LOCAL • CONNECTED • SMART"

                position="0 0.10 0.10"

                align="center"

                width="0.68"

                color="#d7e4ef"

                side="double"

            ></a-text>



            <!-- =================================
                 OPEN APP AR BUTTON
            ================================== -->

            <a-plane

                id="openAppAR"

                class="ar-button"

                position="0 -0.08 0.12"

                width="0.90"

                height="0.22"

                color="#176dcc"

                material="
                    shader: flat;
                    opacity: 0.96;
                "

            ></a-plane>


            <!-- OPEN APP TEXT -->

            <a-text

                value="OPEN APP"

                position="0 -0.08 0.15"

                align="center"

                width="0.72"

                color="#ffffff"

                side="double"

            ></a-text>



            <!-- =================================
                 VISIT WEBSITE AR BUTTON
            ================================== -->

            <a-plane

                id="websiteAR"

                class="ar-button"

                position="0 -0.36 0.12"

                width="0.90"

                height="0.22"

                color="#152b45"

                material="
                    shader: flat;
                    opacity: 0.96;
                "

            ></a-plane>


            <!-- WEBSITE TEXT -->

            <a-text

                value="VISIT WEBSITE"

                position="0 -0.36 0.15"

                align="center"

                width="0.68"

                color="#ffffff"

                side="double"

            ></a-text>


        </a-entity>


    </a-scene>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* ========================================
           WEBSITE URL
        ======================================== */

        const WEBSITE_URL =
            "https://s-j-pavankumar.github.io/LocalSync_AR/website.html";


        /* ========================================
           APP URL
        ======================================== */

        const APP_URL = "";



        /* ========================================
           AR BUTTONS
        ======================================== */

        const openAppButton =
            document.querySelector("#openAppAR");

        const websiteButton =
            document.querySelector("#websiteAR");



        /* ========================================
           OPEN APP
        ======================================== */

        openAppButton.addEventListener(

            "click",

            () => {

                console.log(
                    "LocalSync AR: OPEN APP clicked"
                );


                if (APP_URL.trim() !== "") {

                    window.location.href =
                        APP_URL;

                }

                else {

                    alert(
                        "The LocalSync app link will be connected here."
                    );

                }

            }

        );



        /* ========================================
           VISIT WEBSITE
        ======================================== */

        websiteButton.addEventListener(

            "click",

            () => {

                console.log(
                    "LocalSync AR: VISIT WEBSITE clicked"
                );


                window.location.href =
                    WEBSITE_URL;

            }

        );



        /* ========================================
           OPEN APP HOVER / POINTER FEEDBACK
        ======================================== */

        openAppButton.addEventListener(

            "mouseenter",

            () => {

                openAppButton.setAttribute(
                    "color",
                    "#2385e8"
                );

            }

        );


        openAppButton.addEventListener(

            "mouseleave",

            () => {

                openAppButton.setAttribute(
                    "color",
                    "#176dcc"
                );

            }

        );



        /* ========================================
           WEBSITE HOVER / POINTER FEEDBACK
        ======================================== */

        websiteButton.addEventListener(

            "mouseenter",

            () => {

                websiteButton.setAttribute(
                    "color",
                    "#244566"
                );

            }

        );


        websiteButton.addEventListener(

            "mouseleave",

            () => {

                websiteButton.setAttribute(
                    "color",
                    "#152b45"
                );

            }

        );


    </script>


</body>

</html>
