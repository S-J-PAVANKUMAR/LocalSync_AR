<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LocalSync AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets/localsync-card.mind;
            maxTrack: 1;
            uiScanning: yes;
            uiLoading: yes;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Camera -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- LocalSync AR Content -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- LocalSync Title -->
            <a-text
                value="LocalSync"
                position="0 0.35 0.1"
                align="center"
                color="#2ed39a"
                width="1.8"
                side="double">
            </a-text>


            <!-- OPEN APP Button -->
            <a-plane
                position="0 -0.05 0.1"
                width="1.5"
                height="0.35"
                color="#2ed39a">
            </a-plane>

            <a-text
                value="OPEN APP"
                position="0 -0.05 0.12"
                align="center"
                color="#07100d"
                width="1.2"
                side="double">
            </a-text>


            <!-- VISIT WEBSITE Button -->
            <a-plane
                position="0 -0.50 0.1"
                width="1.5"
                height="0.35"
                color="#111820">
            </a-plane>

            <a-text
                value="VISIT WEBSITE"
                position="0 -0.50 0.12"
                align="center"
                color="#ffffff"
                width="1.2"
                side="double">
            </a-text>

        </a-entity>

    </a-scene>

</body>
</html>
